server.port=8080
spring.application.name=chess-reviewer-by-hamid

# Server configuration
server.servlet.context-path=/

# CORS - Allow frontend origin
cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:63342

# Local Stockfish Configuration
stockfish.engine.enabled=true
stockfish.engine.path=D:\\Fun Coding\\chess-reviewer-by-Hamid\\src\\main\\java\\com\\hamids\\chessreviewerbyhamid\\stockfish\\stockfish-windows-x86-64-avx2.exe

# Stockfish API Fallback Configuration
stockfish.api.fallback.enabled=true
stockfish.api.url=https://stockfish.online/api/s/v2.php

# Engine settings
stockfish.threads=4
stockfish.hash=1024
stockfish.skill-level=20

# Analysis settings
analysis.max-depth=25
analysis.timeout-ms=35000

# Logging
logging.level.com.hamids.chessreviewerbyhamid=DEBUG
logging.level.org.springframework.web=INFO